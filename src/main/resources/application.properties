spring.application.name=SupplyChainX

# Datasource - can be overridden with environment variables when running in Docker
# Default uses localhost for local development (Spring Boot running outside Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supplyChainX?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
# Secret key - IMPORTANT: Change this in production to a secure random value
# Must be at least 256 bits (32 characters) for HS256
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Access token expiration: 15 minutes (in milliseconds)
jwt.access-token-expiration=900000
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-token-expiration=604800000

